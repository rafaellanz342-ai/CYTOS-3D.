<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CYTOS 3D | Laboratório Virtual</title><style>:root{font-family:Inter,system-ui,Arial,sans-serif;color:#edf5ff;background:#07111f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 40% 0,#172d46,#07111f 65%)}header{height:74px;border-bottom:1px solid #29415a;display:flex;align-items:center;justify-content:space-between;padding:0 3.5vw;background:#0a1727}.brand{display:flex;align-items:center;gap:12px}.logo{display:grid;place-items:center;width:40px;height:40px;background:#63e6e2;color:#07111f;border-radius:12px;font-size:25px}.brand b{letter-spacing:.13em;font-size:18px}.brand em{font-style:normal;color:#63e6e2}.brand small{display:block;color:#9bb0c7;font-size:9px;letter-spacing:.14em;margin-top:3px}.status{color:#63e6e2;font-size:10px;letter-spacing:.12em}.intro{padding:28px 3.5vw 23px}.kicker{font-size:10px;letter-spacing:.17em;color:#63e6e2;font-weight:700}.intro h1{font-size:clamp(28px,3.3vw,43px);letter-spacing:-.04em;margin:7px 0}.intro p{color:#9bb0c7;font-size:13px;margin:0}main{display:grid;grid-template-columns:235px minmax(0,1fr) 285px;gap:14px;padding:0 3.5vw 32px;min-height:630px}.panel,.viewer{border:1px solid #29415a;border-radius:15px;background:#101e30;overflow:hidden}.panel{padding:18px}.paneltitle{font-size:11px;letter-spacing:.12em;color:#9bb0c7;font-weight:800;border-bottom:1px solid #29415a;padding-bottom:17px;margin-bottom:18px}.cell,.disabled{display:block;text-align:left;width:100%;border:1px solid #29415a;border-radius:11px;padding:14px 11px;background:#14263b;color:#edf5ff;font-size:12px;margin-bottom:9px}.cell{cursor:pointer}.cell.active{border-color:#63e6e2;background:#1a3847}.cell small{display:block;color:#9bb0c7;margin:5px 0 0 27px}.disabled{opacity:.43}.coming{font-size:10px;color:#9bb0c7;letter-spacing:.1em;margin:26px 0 12px}.note{font-size:10px;line-height:1.7;color:#8198ae}.viewer{position:relative;min-height:630px;background:#091827}#canvas{position:absolute;inset:0}#canvas canvas{width:100%;height:100%;display:block;touch-action:none}.viewportlabel{position:absolute;left:18px;top:18px;font-size:10px;letter-spacing:.13em;color:#b7d1e6;background:#0b2035bb;border:1px solid #29415a;padding:9px;border-radius:8px}.toolbar{position:absolute;right:14px;top:14px;display:flex;flex-wrap:wrap;justify-content:end;gap:6px;max-width:70%}button{font-family:inherit}.toolbar button{cursor:pointer;color:#edf5ff;background:#132a40db;border:1px solid #38526c;border-radius:7px;font-size:10px;padding:9px}.toolbar button:hover,.part:hover{border-color:#63e6e2}.bottom{position:absolute;bottom:16px;left:18px;color:#9bb0c7;font-size:10px;background:#091827aa;padding:8px}.details h2{font-size:23px;margin:9px 0}.details p{font-size:12px;line-height:1.65;color:#b6c8da}.divider{height:1px;background:#29415a;margin:20px 0}.details h3{font-size:11px;letter-spacing:.12em;color:#c5d6e6}.part{width:100%;display:block;text-align:left;background:#14263b;border:1px solid #29415a;color:#edf5ff;border-radius:7px;padding:9px 10px;margin:5px 0;font-size:11px;cursor:pointer}.part.chosen{border-color:#63e6e2;background:#1c4050}.part.labelon:before{content:'• ';color:#63e6e2}.details label{font-size:10px;color:#9bb0c7;display:block;margin-top:20px}.details input{display:block;width:100%;margin-top:10px;accent-color:#63e6e2}@media(max-width:1120px){main{grid-template-columns:190px minmax(0,1fr)}.details{grid-column:1/-1}.viewer{min-height:550px}}@media(max-width:700px){header{height:62px}.status{display:none}.intro{padding:20px 14px}main{grid-template-columns:1fr;padding:0 12px 24px}.panel{padding:13px}.viewer{min-height:470px;grid-row:1}.toolbar{top:auto;bottom:47px;right:9px;left:9px;max-width:none;justify-content:center}.viewportlabel{top:9px;left:9px}.bottom{font-size:9px;bottom:10px;left:10px}.details{grid-column:auto}}

canvas{touch-action:none}button{touch-action:manipulation}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head><body><div id="app"></div><script type="module">import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const descriptions={soma:['Corpo celular','Região metabólica do neurônio, que abriga núcleo e organelas.'],nucleus:['Núcleo','Compartimento que contém o material genético.'],nucleolus:['Nucléolo','Relacionado à produção de componentes ribossômicos.'],nissl:['Corpúsculos de Nissl','Retículo endoplasmático rugoso e ribossomos no soma e dendritos.'],dendrite:['Dendritos','Prolongamentos receptores com arborização complexa.'],spine:['Espinhas dendríticas','Especializações de muitos dendritos que recebem sinapses.'],hillock:['Cone de implantação','Região de transição do soma para o axônio, sem corpúsculos de Nissl.'],axon:['Axônio','Prolongamento que conduz potenciais de ação.'],myelin:['Mielina','Envoltório segmentado que favorece a condução saltatória.'],node:['Nódulo de Ranvier','Intervalo entre segmentos de mielina.'],terminal:['Botões terminais','Regiões especializadas na transmissão sináptica.']};
document.querySelector('#app').innerHTML=`<header><div class="brand"><span class="logo">✦</span><div><b>CYTOS <em>3D</em></b><small>LABORATÓRIO VIRTUAL DE HISTOLOGIA</small></div></div><span class="status">● MODELO INTERATIVO</span></header><div class="intro"><span class="kicker">ATLAS CELULAR · MÓDULO 01</span><h1>Explore a arquitetura da vida.</h1><p>Visualização tridimensional interativa para o ensino de biologia celular e histologia.</p></div><main><aside class="panel"><div class="paneltitle">BIBLIOTECA CELULAR</div><button class="cell active">◈ &nbsp; Neurônio multipolar <small>Tecido nervoso</small></button><div class="coming">PRÓXIMOS MÓDULOS</div><div class="disabled">▦ &nbsp; Epitélio simples</div><div class="disabled">≋ &nbsp; Músculo estriado</div><div class="disabled">◉ &nbsp; Sangue</div><p class="note">Os próximos modelos estão identificados como não implementados nesta versão.</p></aside><section class="viewer"><div id="canvas"></div><div class="viewportlabel">01 / NEURÔNIO MULTIPOLAR</div><div class="toolbar"><button id="reset">⟲ Reiniciar</button><button id="spin">Ⅱ Pausar giro</button><button id="labels">Etiquetas: não</button><button id="isolate">Isolar</button><button id="showall">Mostrar tudo</button></div><div class="bottom">Arraste para girar · Role para zoom · Clique nas estruturas</div></section><aside class="panel details"><div class="paneltitle">EXPLORAÇÃO HISTOLÓGICA</div><span class="kicker">TECIDO NERVOSO</span><h2>Neurônio multipolar</h2><p>Modelo esquemático 3D de um neurônio mielinizado. Selecione estruturas para estudar sua morfologia e função.</p><div class="divider"></div><h3>ESTRUTURAS</h3><div id="parts"></div><div class="divider"></div><h3 id="partname">Selecione uma estrutura</h3><p id="partdesc">Clique no modelo ou em um item da lista.</p><label>TRANSPARÊNCIA DA ESTRUTURA <input id="opacity" type="range" min="15" max="100" value="100"></label><p class="note">Representação esquemática, sem escala real. Não substitui a observação de lâminas histológicas.</p></aside></main>`;
const container=document.querySelector('#canvas');const scene=new THREE.Scene();scene.background=new THREE.Color('#091827');const camera=new THREE.PerspectiveCamera(42,1,.1,100);camera.position.set(0,1.4,12);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;container.append(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minDistance=3;controls.maxDistance=25;scene.add(new THREE.HemisphereLight(0xcbe8ff,0x26304d,2.4));const light=new THREE.DirectionalLight(0xfff0df,3);light.position.set(5,7,9);scene.add(light);const rim=new THREE.PointLight(0x45b5ff,70);rim.position.set(-6,1,-3);scene.add(rim);
const model=new THREE.Group();scene.add(model);const materials={soma:new THREE.MeshPhysicalMaterial({color:0xdf927f,roughness:.46,clearcoat:.2,transparent:true}),nucleus:new THREE.MeshStandardMaterial({color:0x8d66b6,roughness:.3}),nucleolus:new THREE.MeshStandardMaterial({color:0xd7b5ed}),nissl:new THREE.MeshStandardMaterial({color:0x734e9c}),dendrite:new THREE.MeshStandardMaterial({color:0xc97961,roughness:.5}),spine:new THREE.MeshStandardMaterial({color:0xe9ae82}),hillock:new THREE.MeshStandardMaterial({color:0xc98269}),axon:new THREE.MeshStandardMaterial({color:0xf0c18d}),myelin:new THREE.MeshPhysicalMaterial({color:0xe9d7b3,roughness:.27,clearcoat:.5}),node:new THREE.MeshStandardMaterial({color:0xffd89b}),terminal:new THREE.MeshStandardMaterial({color:0xf4ab7e})};const groups={};Object.keys(descriptions).forEach(id=>{groups[id]=new THREE.Group();groups[id].userData.part=id;model.add(groups[id])});function add(id,geometry,position,scale){const mesh=new THREE.Mesh(geometry,materials[id]);mesh.userData.part=id;mesh.position.copy(position);if(scale)mesh.scale.copy(scale);groups[id].add(mesh);return mesh}
function organicSphere(id,pos,r,seed=0){const geo=new THREE.IcosahedronGeometry(r,5);const p=geo.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i);const n=1+.045*Math.sin(x*5+seed)*Math.cos(y*6)+.028*Math.sin(z*9+x*3);p.setXYZ(i,x*n,y*n,z*n)}geo.computeVertexNormals();return add(id,geo,new THREE.Vector3(...pos))}
organicSphere('soma',[0,0,0],.88,1);add('nucleus',new THREE.SphereGeometry(.4,40,32),new THREE.Vector3(.04,.05,.12));add('nucleolus',new THREE.SphereGeometry(.115,24,16),new THREE.Vector3(.13,.12,.45));for(let i=0;i<26;i++){const a=i*2.399,r=.35*Math.sqrt((i+.5)/26);const x=Math.cos(a)*r,y=Math.sin(a)*r;const m=add('nissl',new THREE.IcosahedronGeometry(.055,1),new THREE.Vector3(x,y,.68));m.scale.set(1.5,.55,.7)}
function variableTube(id,points,r0,r1){const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)));const steps=Math.max(20,points.length*14),sides=9;const frames=curve.computeFrenetFrames(steps,false),verts=[],norm=[],indices=[];for(let i=0;i<=steps;i++){const t=i/steps,center=curve.getPointAt(t),radius=r0*(1-t)+r1*t;for(let j=0;j<=sides;j++){const a=j/sides*Math.PI*2;const offset=frames.normals[i].clone().multiplyScalar(Math.cos(a)).addScaledVector(frames.binormals[i],Math.sin(a));const v=center.clone().addScaledVector(offset,radius);verts.push(v.x,v.y,v.z);norm.push(offset.x,offset.y,offset.z);if(i<steps&&j<sides){const k=i*(sides+1)+j;indices.push(k,k+sides+1,k+1,k+1,k+sides+1,k+sides+2)}}}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(norm,3));g.setIndex(indices);add(id,g,new THREE.Vector3());return curve}
const seedBranches=[[[ -.5,.45,0],[-1.1,.95,.2],[-1.6,1.2,.3],[-2.1,1.7,.2]],[[ -.7,.05,0],[-1.35,.1,-.2],[-2,.0,-.5],[-2.65,.35,-.6]],[[ -.48,-.4,0],[-.9,-1.1,.2],[-1.3,-1.6,.35],[-1.8,-2.1,.5]],[[.1,.75,0],[.25,1.5,-.3],[.5,2,-.45],[.8,2.5,-.35]],[[.58,.5,0],[1.1,1.1,-.2],[1.55,1.45,-.45],[1.95,1.8,-.6]],[[ -.05,-.7,0],[.2,-1.25,-.35],[.4,-1.85,-.5],[.7,-2.3,-.6]]];for(let b=0;b<seedBranches.length;b++){const pts=seedBranches[b];variableTube('dendrite',pts,.19,.045);const end=pts.at(-1),before=pts.at(-2);for(let j=0;j<2;j++){const v=j===0?[-.45,.38,.3]:[.35,-.2,-.4];const tip=end.map((n,k)=>n+v[k]);variableTube('dendrite',[before,end,tip],.07,.012);for(let s=1;s<=3;s++){const t=s/4,sp=end.map((n,k)=>n*(1-t)+tip[k]*t);const head=[sp[0]+.09,sp[1]+.07,sp[2]+.06];variableTube('spine',[sp,head],.027,.012);add('spine',new THREE.SphereGeometry(.045,10,8),new THREE.Vector3(...head))}}}
variableTube('hillock',[[.7,-.35,0],[1,-.48,.0],[1.25,-.53,0]],.24,.12);const axonPoints=[[1.2,-.52,0],[2,-.7,.0],[2.8,-.8,.15],[3.65,-.7,.22],[4.5,-.4,.28],[5.2,-.15,.32]];const axCurve=variableTube('axon',axonPoints,.105,.09);for(let i=0;i<5;i++){const a=.14+i*.15,b=a+.115;const pts=[];for(let j=0;j<=8;j++){const t=a+(b-a)*j/8,p=axCurve.getPoint(t);pts.push([p.x,p.y,p.z])}variableTube('myelin',pts,.22,.22);if(i<4){const p=axCurve.getPoint(b+.018);add('node',new THREE.TorusGeometry(.115,.023,8,20),p).quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),axCurve.getTangent(b+.018))}}const end=axonPoints.at(-1);for(let i=0;i<5;i++){const target=[end[0]+.45+(i%2)*.2,end[1]+(i-2)*.3,end[2]+Math.sin(i*2)*.25];variableTube('terminal',[end,[end[0]+.22,end[1]+(i-2)*.12,end[2]],target],.07,.018);add('terminal',new THREE.SphereGeometry(.095,14,12),new THREE.Vector3(...target))}
const list=document.querySelector('#parts');let selected=null,rotation=true,labels=false;for(const [id,[name]] of Object.entries(descriptions)){const btn=document.createElement('button');btn.className='part';btn.dataset.part=id;btn.textContent=name;btn.addEventListener('click',()=>select(id));list.append(btn)}function select(id){selected=id;document.querySelector('#partname').textContent=descriptions[id][0];document.querySelector('#partdesc').textContent=descriptions[id][1];document.querySelectorAll('.part').forEach(el=>el.classList.toggle('chosen',el.dataset.part===id));document.querySelector('#opacity').value=Math.round(materials[id].opacity*100)}const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();renderer.domElement.addEventListener('click',e=>{const r=renderer.domElement.getBoundingClientRect();pointer.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(pointer,camera);const hits=ray.intersectObject(model,true);if(hits.length){let obj=hits[0].object;while(obj&&!obj.userData.part)obj=obj.parent;if(obj?.userData.part)select(obj.userData.part)}});document.querySelector('#opacity').addEventListener('input',e=>{if(!selected)return;const m=materials[selected];m.opacity=Number(e.target.value)/100;m.transparent=m.opacity<1||selected==='soma';m.depthWrite=m.opacity>=1;m.needsUpdate=true});document.querySelector('#reset').onclick=()=>{camera.position.set(0,1.4,12);controls.target.set(1,0,0);controls.update()};document.querySelector('#spin').onclick=e=>{rotation=!rotation;e.target.textContent=rotation?'Ⅱ Pausar giro':'▶ Girar'};document.querySelector('#isolate').onclick=()=>{if(!selected)return;Object.entries(groups).forEach(([id,g])=>g.visible=id===selected)};document.querySelector('#showall').onclick=()=>{Object.values(groups).forEach(g=>g.visible=true)};document.querySelector('#labels').onclick=e=>{labels=!labels;e.target.textContent='Etiquetas: '+(labels?'sim':'não');document.querySelectorAll('.part').forEach(el=>el.classList.toggle('labelon',labels))};controls.target.set(1,0,0);controls.update();function resize(){const w=container.clientWidth,h=container.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(container);resize();let previous=performance.now();function animate(t){requestAnimationFrame(animate);const dt=Math.min((t-previous)/1000,.05);previous=t;if(rotation)model.rotation.y+=dt*.11;controls.update();renderer.render(scene,camera)}requestAnimationFrame(animate);
</script></body></html>
