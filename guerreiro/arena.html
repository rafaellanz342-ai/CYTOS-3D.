<title>Guerreiro Ósseo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ink:#070506;--gold:#b98a45;--gold2:#e2bd72;--goldhi:#ffe3a3;--bone:#e8dcc0;--blood:#8a1620;--text:#e6dbc6;--muted:#a3937e;--fs:'Cinzel',Georgia,serif;--fb:'IM Fell English',Georgia,serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#050304;color:var(--text);font-family:var(--fb);user-select:none;-webkit-user-select:none;touch-action:none}
canvas#cv{position:fixed;inset:0;display:block}
.frame{background:linear-gradient(180deg,rgba(29,21,23,.92),rgba(16,11,12,.92));border:1px solid #6b5233;box-shadow:0 0 0 1px #000,0 0 0 3px #2a2022,0 0 0 4px #7d6038,0 10px 30px rgba(0,0,0,.7)}
h1{font-family:var(--fs);font-weight:700;letter-spacing:.14em;color:var(--gold2);text-transform:uppercase;font-size:15px;margin:0 0 2px}
.sub{color:var(--muted);font-style:italic;font-size:13px;margin:0 0 10px}
#panel{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));width:262px;padding:14px;z-index:5;max-height:calc(100% - 24px);overflow:auto}
#panel.min .body{display:none}
.lbl{font-family:var(--fs);font-size:10.5px;letter-spacing:.12em;color:var(--gold);text-transform:uppercase;margin:12px 0 6px}
.row{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.btn{font-family:var(--fs);font-weight:700;letter-spacing:.06em;font-size:11px;padding:7px 9px;color:#f4e2bb;background:linear-gradient(180deg,#4a2a22,#2a1513);border:1px solid #9a6d3a;box-shadow:inset 0 1px 0 rgba(255,220,160,.2),0 2px 0 #000;border-radius:2px}
.btn:hover{filter:brightness(1.2)} .btn:active{transform:translateY(1px)}
.btn.on{color:#2a1606;background:linear-gradient(180deg,#ffe3a3,#c79a4b 60%,#8a5f22);border-color:#3a2408}
.btn kbd{font-family:var(--fb);opacity:.65;font-size:10px;margin-left:3px}
input[type=range]{width:100%;accent-color:#b98a45}
.hint{font-size:12.5px;color:var(--muted);line-height:1.45}
#toggle{position:absolute;top:10px;right:10px;font-family:var(--fs);color:var(--gold2);font-size:13px;padding:2px 6px}
#inset{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));width:150px;padding:8px 8px 6px;z-index:5;text-align:center}
#inset canvas{width:134px;height:150px;display:block}
#inset .lbl{margin:4px 0 0;font-size:9.5px}
/* controles de toque */
#joy{position:fixed;left:calc(22px + env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:124px;height:124px;border-radius:50%;border:1px solid rgba(185,138,69,.55);background:radial-gradient(circle,rgba(0,0,0,.15),rgba(0,0,0,.45));z-index:6;display:none}
#joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe3a3,#b98a45 55%,#4a2f12);box-shadow:0 0 0 2px #000}
#acts{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));display:none;grid-template-columns:repeat(3,58px);gap:8px;z-index:6}
.btn.sh[disabled]{opacity:.35}
#acts button{width:58px;height:58px;border-radius:50%;font-family:var(--fs);font-size:9px;font-weight:700;letter-spacing:.04em;color:#f4e2bb;background:radial-gradient(circle at 40% 30%,#6a3a2c,#2a1513 70%);border:1px solid #9a6d3a;box-shadow:0 0 0 2px #000,inset 0 1px 0 rgba(255,220,160,.25)}
#acts button.big{background:radial-gradient(circle at 40% 30%,#b8262f,#4a0a10 70%)}
@media (pointer:coarse){#joy{display:block}#acts{display:grid}#panel{width:220px;padding:10px}#panel:not(.open) .body{display:none}#inset{display:none}}
</style>
<canvas id="cv"></canvas>

<div id="panel" class="frame">
  <button id="toggle" aria-label="Mostrar ou esconder o painel">☰</button>
  <h1>Guerreiro Ósseo</h1>
  <p class="sub">Ortopedista de Guerra · espada, lança, foice e escudo</p>
  <div class="body">
    <div class="lbl">Arma</div>
    <div class="row" id="wpn">
      <button class="btn on" data-w="espada">Espada</button>
      <button class="btn" data-w="lanca">Lança</button>
      <button class="btn" data-w="foice">Foice longa</button>
      <button class="btn" id="shieldBtn">Escudo</button>
      <button class="btn" id="armorBtn">Armadura</button>
    </div>
    <div class="lbl">Golpes da arma <span style="opacity:.6">(Q troca a arma)</span></div>
    <div class="row">
      <button class="btn" data-act="golpe"><span data-name="golpe">Golpe</span> ×3<kbd>J</kbd></button>
      <button class="btn" data-act="esmagar"><span data-name="esmagar">Esmagar</span><kbd>1</kbd></button>
      <button class="btn" data-act="investida"><span data-name="investida">Investida</span><kbd>2</kbd></button>
      <button class="btn" data-act="redemoinho"><span data-name="redemoinho">Redemoinho</span><kbd>4</kbd></button>
    </div>
    <div class="lbl">Escudo e gerais</div>
    <div class="row">
      <button class="btn sh" data-act="escudo">Golpe de Escudo<kbd>5</kbd></button>
      <button class="btn sh" id="blockBtn">Bloquear (segurar)<kbd>B</kbd></button>
      <button class="btn" data-act="brado">Brado<kbd>3</kbd></button>
      <button class="btn" data-act="rolar">Esquiva<kbd>Espaço</kbd></button>
      <button class="btn" data-act="dano">Dano<kbd>H</kbd></button>
      <button class="btn" data-act="morte">Morte / Reviver<kbd>K</kbd></button>
    </div>
    <div class="lbl">Cores do tema</div>
    <div class="row" id="thm">
      <button class="btn on" data-t="carmesim">Carmesim</button>
      <button class="btn" data-t="real">Real</button>
      <button class="btn" data-t="peste">Peste</button>
      <button class="btn" data-t="obsidiana">Obsidiana</button>
    </div>
    <div class="lbl">Arma (raridade)</div>
    <div class="row" id="rar">
      <button class="btn on" data-r="">Comum</button>
      <button class="btn" data-r="#6c9bff">Mágico</button>
      <button class="btn" data-r="#ffd94a">Raro</button>
      <button class="btn" data-r="#ff8a1e">Lendário</button>
    </div>
    <div class="lbl">Câmera</div>
    <div class="row"><button class="btn" id="spin">Girar 360°</button><button class="btn" id="walkBtn">Andar em círculo</button></div>
    <div class="lbl">Zoom</div>
    <input type="range" id="zoom" min="60" max="260" value="150">
    <p class="hint">Mover: <b>WASD</b> ou setas · clique = golpe.<br>No celular: joystick à esquerda e botões à direita.</p>
  </div>
</div>

<div id="inset" class="frame"><canvas id="mini" width="268" height="300"></canvas><div class="lbl">Tamanho no jogo · 118 px</div></div>

<div id="joy"><i></i></div>
<div id="acts">
  <button data-act="esmagar">Esmagar</button><button data-act="investida">Investida</button><button data-act="brado">Brado</button>
  <button data-act="rolar">Esquiva</button><button data-act="redemoinho">Rede-moinho</button><button data-act="golpe" class="big">Golpe</button>
  <button data-act="escudo">Escudo</button><button id="blockT">Bloq.</button><button id="swapT">Trocar arma</button>
</div>

<script>/* guerreiro-osseo.js */
/* =====================================================================
   GUERREIRO ÓSSEO — "Ortopedista de Guerra" (O Atlas Perdido)
   Personagem 2.5D 100% procedural: esqueleto 3D (cinemática direta +
   IK de dois ossos) projetado no isométrico 2:1 do jogo e renderizado
   como malhas texturizadas (texturas geradas por código, UV afim por
   face, luz por face, especular e contraluz). Nenhuma imagem externa.

   Armas: espada de fêmur, lança vertebral e foice longa — cada uma com
   o seu conjunto de golpes. Escudo opcional (espada e lança) com
   bloqueio e golpe de escudo.

   Uso:
     const g = GuerreiroOsseo.create({ scale: 72, weapon: 'lanca', shield: true, theme: 'carmesim' });
     g.update(dt, { moving, facing, vx, vy });
     g.play('golpe');            // golpe | esmagar | investida | redemoinho | brado | rolar | escudo | bloquear | dano | morte
     g.release('bloquear');
     g.draw(ctx, telaX, telaY, { rarity: '#ffd94a' });
   ===================================================================== */
(function (root) {
  'use strict';

  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, k) => a + (b - a) * k;
  const easeIO = t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
  const angLerp = (a, b, k) => a + (((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI) * k;

  // ---------- vetores ----------
  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const len = a => Math.hypot(a[0], a[1], a[2]);
  const norm = a => { const l = len(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
  const mix = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];

  const Rz = a => { const c = Math.cos(a), s = Math.sin(a); return [c, -s, 0, s, c, 0, 0, 0, 1]; };
  const Ry = a => { const c = Math.cos(a), s = Math.sin(a); return [c, 0, s, 0, 1, 0, -s, 0, c]; };
  const Rx = a => { const c = Math.cos(a), s = Math.sin(a); return [1, 0, 0, 0, c, -s, 0, s, c]; };
  const mm = (A, B) => { const r = []; for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) r.push(A[i * 3] * B[j] + A[i * 3 + 1] * B[3 + j] + A[i * 3 + 2] * B[6 + j]); return r; };
  const mv = (M, v) => [M[0] * v[0] + M[1] * v[1] + M[2] * v[2], M[3] * v[0] + M[4] * v[1] + M[5] * v[2], M[6] * v[0] + M[7] * v[1] + M[8] * v[2]];
  const sph = (el, az) => [Math.cos(el) * Math.cos(az), Math.cos(el) * Math.sin(az), Math.sin(el)];

  // ---------- câmera isométrica 2:1 (a mesma do jogo: isoX=(x-y)k, isoY=(x+y)k/2) ----------
  const CP = Math.cos(Math.PI / 6), SP = 0.5, R2 = Math.SQRT1_2;
  const CAM = norm([CP * R2, CP * R2, SP]);              // aponta para o observador
  const LIGHT_W = norm([-0.75, 0.05, 0.85]);             // luz da tocha: alto, à esquerda
  const proj = (p, s) => [(p[0] - p[1]) * R2 * s, ((p[0] + p[1]) * R2 * SP - p[2] * CP) * s];
  const depthOf = p => (p[0] + p[1]) * R2 * CP + p[2] * SP;

  const MAT = { bone: { base: '#e8dcc0' } };
  const INK = '#070506';

  // ---------- proporções (metros) ----------
  // Proporções no cânone heroico de 8 cabeças (Loomis; Richer; Gray's Anatomy) para ~1,85 m:
  // cabeça 0,23 m; ombro (acrômio) a 1,51 m; mamilos a 2 cabeças do topo; umbigo a 3; púbis a 4 (metade da altura);
  // fêmur ≈ 2 cabeças; tíbia ≈ 2 cabeças menos o tornozelo; úmero ≈ 1,4 cabeça; antebraço ≈ 1,2; pé ≈ 1,15.
  const SK = { thigh: 0.46, shin: 0.44, ankle: 0.08, hipW: 0.09, torso: 0.55, shW: 0.2, neck: 0.06, headR: 0.115,
    uarm: 0.32, farm: 0.27, blade: 0.88, shieldR: 0.28 };

  // ---------- crânio e face esculpidos (não é uma esfera) ----------
  // la: longitude (0 = frente do rosto), ph: ângulo polar a partir do topo. Devolve [frente, lado, cima] em metros,
  // a partir do centro da cabeça (na altura das orelhas). Medidas médias de adulto: comprimento 0,20 m,
  // largura 0,15 m, altura topo–queixo 0,23 m. Relevos: arco superciliar, órbitas, dorso e asas do nariz,
  // zigomáticos, sulco nasolabial, lábios, queixo, ângulo da mandíbula, têmporas, orelhas e nuca.
  const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  function headShape(la, ph, feat, eyeLa) {
    const v = ph / Math.PI, sp = Math.sin(ph), cp = Math.cos(ph), cl = Math.cos(la), sl = Math.sin(la);
    const front = Math.max(0, cl), lower = sstep(0.5, 0.9, v);
    const ax = cl > 0 ? 0.097 * (1 - 0.1 * lower * (1 - front)) : 0.103 * (1 - 0.42 * sstep(0.55, 0.95, v)); // occipital e nuca
    const ay = 0.077 * (1 - 0.14 * lower - 0.1 * lower * front) * (1 + 0.04 * sstep(0.3, 0.5, v) * (1 - sstep(0.5, 0.7, v)));

    let p = [sp * cl * ax, sp * sl * ay, cp * az];
    if (!feat) return p;
    const L = Math.abs(la), e = eyeLa || 0.36;
    const g = (l0, v0, sl0, sv, a) => a * Math.exp(-Math.pow((L - l0) / sl0, 2) / 2 - Math.pow((v - v0) / sv, 2) / 2);
    let b = 0;
    b += g(0, 0.445, 0.55, 0.025, 0.011);                                   // arco superciliar
    b += g(e, 0.5, 0.12, 0.032, -0.017);                                    // órbitas
    b += g(0, 0.5, 0.14, 0.03, -0.006);                                     // raiz do nariz
    b += 0.026 * Math.exp(-Math.pow(la / 0.075, 2) / 2) * sstep(0.47, 0.6, v) * (1 - sstep(0.6, 0.64, v)); // dorso do nariz até a ponta
    b += g(0.17, 0.6, 0.07, 0.022, 0.008);                                  // asas do nariz
    b += g(0.78, 0.53, 0.22, 0.05, 0.011);                                  // zigomáticos (maçãs do rosto)
    b += g(0.35, 0.6, 0.12, 0.04, -0.005);                                  // sulco abaixo da maçã
    b += g(0, 0.675, 0.32, 0.035, 0.008);                                   // boca (arcada dentária)
    b += g(0, 0.678, 0.26, 0.007, -0.004);                                  // fenda dos lábios
    b += g(0, 0.72, 0.2, 0.012, -0.004);                                    // sulco mentolabial
    b += g(0, 0.765, 0.28, 0.03, 0.01);                                     // queixo largo
    b += g(1.2, 0.73, 0.3, 0.06, 0.016);                                    // ângulo da mandíbula (quadrada)
    b += g(1.12, 0.38, 0.2, 0.07, -0.006);                                  // têmporas
    b += g(Math.PI / 2, 0.53, 0.12, 0.05, 0.013);                           // orelhas
    const n = norm(p);
    return add(p, mul(n, b));
  }

  // ======================================================================
  //  POSES E CONJUNTOS DE GOLPES
  //  Convenção local (antes do espelho): x = frente, y = esquerda, z = cima.
  //  hR/hL: mãos no referencial do tronco. sp/sy: elevação/azimute da arma.

  // ---------- IK de dois ossos ----------
  function ik(a, t, l1, l2, pole) {
    const d = sub(t, a); let dl = len(d);
    dl = clamp(dl, Math.abs(l1 - l2) + 1e-3, (l1 + l2) * 0.999);
    const u = norm(d), ca = (l1 * l1 + dl * dl - l2 * l2) / (2 * l1 * dl), sa = Math.sqrt(Math.max(0, 1 - ca * ca));
    let pp = sub(pole, mul(u, dot(pole, u))); pp = len(pp) < 1e-5 ? norm(cross(u, [0, 0, 1])) : norm(pp);
    return [add(a, add(mul(u, l1 * ca), mul(pp, l1 * sa))), add(a, mul(u, dl))];
  }

  Warrior.prototype.local2world = function (v) { const a = this.facing; return [v[0] * Math.cos(a) - v[1] * Math.sin(a), v[0] * Math.sin(a) + v[1] * Math.cos(a), v[2]]; };

  // ======================================================================

  const THEMES = {

    obsidiana: { name: 'Obsidiana', cloth: ['#3e3e4a', '#22222a', '#08080c'], trim: '#c4ccd8', trimD: '#4a5060', gem: [90, 200, 255], rim: [120, 190, 255] }

  // arabesco gótico gravado (sulco escuro + borda clara)

    for (let i = 0; i < h * 1.5; i++) { g.strokeStyle = R() < 0.5 ? 'rgba(255,245,235,.06)' : 'rgba(0,0,0,.12)'; g.lineWidth = 0.6 + R(); const y = R() * h; g.beginPath(); g.moveTo(0, y); g.lineTo(w, y + (R() - 0.5) * 6); g.stroke(); }
    for (let i = 0; i < w / 4; i++) { g.strokeStyle = `rgba(235,225,215,${0.1 + R() * 0.22})`; g.lineWidth = 0.7; const x = R() * w, y = R() * h, a = R() * TAU, l = 3 + R() * 14; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }

  function boneShape(g, x1, y1, x2, y2, r, fill, dark) {

  const ORDER = ['espada', 'lanca', 'foice'];
  const setW = w => {
    hero.setWeapon(w, w === 'foice' ? false : st.shield);
    document.querySelectorAll('#wpn [data-w]').forEach(b => b.classList.toggle('on', b.dataset.w === w));
    const shOk = GuerreiroOsseo.WEAPONS[w].shieldOk;
    document.getElementById('shieldBtn').classList.toggle('on', hero.shield); document.getElementById('shieldBtn').disabled = !shOk;
    document.querySelectorAll('.btn.sh').forEach(b => b.disabled = !hero.shield);
    document.querySelectorAll('[data-name]').forEach(sp => sp.textContent = hero.moveName(sp.dataset.name));
  };
  st.shield = false;
  document.getElementById('armorBtn').addEventListener('click', e => { hero.setArmor(!hero.armor); e.currentTarget.classList.toggle('on', hero.armor); });
  document.querySelectorAll('#wpn [data-w]').forEach(b => b.addEventListener('click', () => setW(b.dataset.w)));
  document.getElementById('shieldBtn').addEventListener('click', () => { st.shield = !st.shield; setW(hero.weapon); });
  const swap = () => setW(ORDER[(ORDER.indexOf(hero.weapon) + 1) % 3]);
  document.getElementById('swapT').addEventListener('pointerdown', e => { e.preventDefault(); swap(); });
  const block = on => on ? hero.play('bloquear') : hero.release('bloquear');
  for (const id of ['blockBtn', 'blockT']) { const b = document.getElementById(id); b.addEventListener('pointerdown', e => { e.preventDefault(); block(true); }); for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) b.addEventListener(ev, () => block(false)); }
  setW('espada');
  addEventListener('keydown', e => {
    const k = e.key.toLowerCase(); st.keys[k] = true;
    const m = { j: 'golpe', '1': 'esmagar', '2': 'investida', '3': 'brado', '4': 'redemoinho', '5': 'escudo', ' ': 'rolar', h: 'dano', k: 'morte' }[k];
    if (m && !e.repeat) { ACT(m); e.preventDefault(); }
    if (k === 'q' && !e.repeat) swap();
    if (k === 'b' && !e.repeat) block(true);
  });
  addEventListener('keyup', e => { const k = e.key.toLowerCase(); st.keys[k] = false; if (k === 'b') block(false); });
  cv.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse') ACT('golpe'); });
  document.querySelectorAll('[data-act]').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); ACT(b.dataset.act); }));
  document.querySelectorAll('#rar .btn').forEach(b => b.addEventListener('click', () => { document.querySelectorAll('#rar .btn').forEach(x => x.classList.remove('on')); b.classList.add('on'); st.rar = b.dataset.r; }));
  document.querySelectorAll('#thm .btn').forEach(b => b.addEventListener('click', () => { document.querySelectorAll('#thm .btn').forEach(x => x.classList.remove('on')); b.classList.add('on'); hero.setTheme(b.dataset.t); }));
  const tog = (id, key) => { const b = document.getElementById(id); b.addEventListener('click', () => { st[key] = !st[key]; b.classList.toggle('on', st[key]); }); };
  tog('spin', 'spin'); tog('walkBtn', 'circle');
  document.getElementById('zoom').addEventListener('input', e => st.zoom = +e.target.value);
  document.getElementById('toggle').addEventListener('click', () => { const p = document.getElementById('panel'); p.classList.toggle(matchMedia('(pointer:coarse)').matches ? 'open' : 'min'); });
  // joystick
  const joy = document.getElementById('joy'), knob = joy.querySelector('i'); let jid = null;
  const jmove = e => { const r = joy.getBoundingClientRect(); let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2); const l = Math.hypot(dx, dy), mx = r.width / 2 - 10; if (l > mx) { dx *= mx / l; dy *= mx / l; } knob.style.transform = `translate(${dx}px,${dy}px)`; st.joy = [dx / mx, dy / mx]; };
  joy.addEventListener('pointerdown', e => { jid = e.pointerId; joy.setPointerCapture(jid); jmove(e); });
  joy.addEventListener('pointermove', e => { if (e.pointerId === jid) jmove(e); });
  const jend = () => { jid = null; st.joy = [0, 0]; knob.style.transform = ''; };
  joy.addEventListener('pointerup', jend); joy.addEventListener('pointercancel', jend);

  // tela -> mundo: direção (sx, sy) no isométrico 2:1
  const screenDirToWorld = (sx, sy) => { const wx = sx + 2 * sy, wy = -sx + 2 * sy; const l = Math.hypot(wx, wy) || 1; return [wx / l, wy / l]; };

  // ---------- chão ----------
  const hash = (x, y) => { let h = (x * 374761393 + y * 668265263) ^ 0x5bf03635; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; };
  function drawFloor(camX, camY, s, cx, cy) {
    const R = Math.ceil(Math.max(W, H) / s * 1.2) + 2, x0 = Math.floor(camX), y0 = Math.floor(camY);
    for (let gy = y0 - R; gy <= y0 + R; gy++) for (let gx = x0 - R; gx <= x0 + R; gx++) {
      const p = [[gx, gy, 0], [gx + 1, gy, 0], [gx + 1, gy + 1, 0], [gx, gy + 1, 0]].map(q => proj([q[0] - camX, q[1] - camY, 0], s));
      if (p[0][1] + cy > H + s || p[2][1] + cy < -s) continue;
      const h = hash(gx, gy), l = 15 + h * 9;
      ctx.beginPath(); p.forEach((q, i) => i ? ctx.lineTo(q[0] + cx, q[1] + cy) : ctx.moveTo(q[0] + cx, q[1] + cy)); ctx.closePath();
      ctx.fillStyle = `rgb(${l + 6 | 0},${l | 0},${l - 1 | 0})`; ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = Math.max(1, s * 0.02); ctx.stroke();
      if (h > 0.86) { // ossinhos e pó no chão
        const q = proj([gx + 0.5 - camX, gy + 0.5 - camY, 0], s), a = h * 40;
        ctx.save(); ctx.translate(q[0] + cx, q[1] + cy); ctx.scale(1, 0.5); ctx.rotate(a);
        ctx.strokeStyle = 'rgba(200,180,140,.35)'; ctx.lineWidth = s * 0.03; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(-s * 0.18, 0); ctx.lineTo(s * 0.18, 0); ctx.stroke();
        ctx.fillStyle = 'rgba(200,180,140,.35)'; for (const e of [-1, 1]) { ctx.beginPath(); ctx.arc(e * s * 0.19, -s * 0.02, s * 0.03, 0, 7); ctx.arc(e * s * 0.19, s * 0.03, s * 0.03, 0, 7); ctx.fill(); }
        ctx.restore();
      }
    }
  }

  // ---------- loop ----------
  let last = performance.now(), ang = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    // direção de movimento
    let mx = 0, my = 0; const K = st.keys;
    if (K['a'] || K['arrowleft']) mx -= 1; if (K['d'] || K['arrowright']) mx += 1; if (K['w'] || K['arrowup']) my -= 1; if (K['s'] || K['arrowdown']) my += 1;
    mx += st.joy[0]; my += st.joy[1];
    let moving = Math.hypot(mx, my) > 0.15, facing = null, vx = 0, vy = 0;
    if (st.circle && !moving) { ang += dt * 0.9; const d = [Math.cos(ang + Math.PI / 2), Math.sin(ang + Math.PI / 2)]; mx = 0; moving = true; facing = Math.atan2(d[1], d[0]); vx = d[0] * 2.4; vy = d[1] * 2.4; }
    else if (moving) { const d = screenDirToWorld(mx, my); facing = Math.atan2(d[1], d[0]); vx = d[0] * 2.6; vy = d[1] * 2.6; }
    if (st.spin && !moving) facing = hero.facing + dt * 1.1;
    const act = hero.action && hero.action.name;
    if (hero.dead || hero.still() || act === 'bloquear') { vx = vy = 0; moving = false; }
    if (st.dash && st.dash.t > 0) { st.dash.t -= dt; vx = Math.cos(hero.facing) * st.dash.v; vy = Math.sin(hero.facing) * st.dash.v; moving = act === 'investida'; }
    if (act === 'redemoinho') { vx *= 0.6; vy *= 0.6; }
    st.x += vx * dt; st.y += vy * dt;
    hero.update(dt, { moving, facing, vx, vy, speed: 2.6 });

    // desenho
    const s = st.zoom;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#050304'; ctx.fillRect(0, 0, W, H);
    const cx = W / 2, cy = H * 0.6;
    drawFloor(st.x, st.y, s * 0.75, cx, cy);
    // poça de luz quente da tocha + vinheta
    let g = ctx.createRadialGradient(cx - s * 0.3, cy - s * 0.4, 0, cx, cy, Math.max(W, H) * 0.6);
    g.addColorStop(0, 'rgba(255,170,90,.16)'); g.addColorStop(0.35, 'rgba(120,60,30,.06)'); g.addColorStop(1, 'rgba(0,0,0,.85)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    hero.draw(ctx, cx, cy, { scale: s, rarity: st.rar || null, hurt: act === 'dano' ? 1 - hero.action.t / hero.action.dur : 0 });

    // miniatura no tamanho do jogo (118 px de altura)
    if (mini.offsetParent) {
      mctx.setTransform(1, 0, 0, 1, 0, 0); mctx.clearRect(0, 0, 268, 300);
      const mg = mctx.createRadialGradient(134, 210, 0, 134, 210, 160); mg.addColorStop(0, '#2a2022'); mg.addColorStop(1, '#0c0809'); mctx.fillStyle = mg; mctx.fillRect(0, 0, 268, 300);
      mctx.setTransform(2, 0, 0, 2, 0, 0);
      hero.draw(mctx, 67, 120, { scale: 74, rarity: st.rar || null });
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
